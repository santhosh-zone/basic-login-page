<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
<div id="lead">
    <h1>EMPLOYEE DETAILS</h1>
    <form >
            
        <div class="san">
           <h3>Name</h3>
          <div class="inputBox">
             <input type="text" placeholder=" " required>
             <label>Enter your name</label>
          </div>
        </div>

        <div class="san1">
           <h3>Father Name</h3>
            <div class="inputBox">
               <input type="text" placeholder=" " required>
               <label>Enter your Fathername</label>
             </div>
        </div>

        <div class="san2">
                <h3>Mother Name</h3>
            <div class="inputBox">
                <input type="text" placeholder=" " required>
                <label>Enter your Mothername</label>
            </div>
        </div>

        <div class="san3">
            <h3>Email</h3>
            <div class="inputBox">
                <input type="email" placeholder=" " required>
                <label>Enter your Email</label>
            </div>
        </div>

        <div class="san4">
            <h3>Number</h3>
            <div class="inputBox">
                <input type="number" placeholder=" " required>
                <label>Enter your number</label>
            </div>
        </div>
        
        <div class="san5">
            <h3>Upload Resume</h3>
            <div class="inputBox">
                <input type="file" placeholder=" " required>
            </div>
        </div>

        
        <div class="san6">
            <h3 >Select</h3>
            <div class="inputBox">
                <select style="color:crimson; font-size: 20px;">
                    <option >PYTHON</option>
                    <option >CSE</option>
                    <option >JAVA</option>
                </select>
            </div>
        </div>

        <div class="san7">
        <button onclick=window.location.href="index.html">Submit</button>
        </div>
        
    </form>
</div>
</body>
</html>
